name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run CI checks
        uses: ./.github/actions/ci
      - uses: cli/gh-extension-precompile@v2.0.0
        with:
          build_script_override: ci/build-artifacts.sh
          go_version_file: go.mod
